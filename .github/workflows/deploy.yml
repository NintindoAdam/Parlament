name: Deploy do GitHub Pages

# Przy każdym pushu: pobierz świeże dane z API Sejmu, zbuduj statyczną stronę i
# opublikuj ją na GitHub Pages. Krok „Synchronizacja" jest jednocześnie testem
# dostępności API — jeśli zakończy się błędem, zobaczysz to w logach Akcji.

on:
  push:
    branches:
      - main
      - claude/parliament-seating-map-taz3k0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pozwól na jeden równoległy deploy; nie przerywaj trwającego.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Konfiguracja GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Tworzy stronę Pages, jeśli nie istnieje (wymaga pages: write).
          enablement: true
          # UWAGA: świadomie NIE używamy `static_site_generator: next`, bo ta opcja
          # przepisuje next.config i psuje plik .mjs. basePath ustawiamy ręcznie poniżej.

      # enablement tworzy stronę, ale NIE przełącza istniejącej z trybu
      # „Deploy from a branch" — a wtedy przy każdym pushu builder Jekylla
      # publikuje README i ściga się z naszym deployem (kto ostatni, ten wygrywa).
      # Wymuszenie build_type=workflow wyłącza builder Jekylla na stałe
      # i samonaprawia konfigurację przy każdym uruchomieniu.
      - name: Wymuś publikowanie wyłącznie przez GitHub Actions
        run: |
          code=$(curl -sS -o /tmp/pages-resp.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> HTTP $code"
          if [ "$code" != "204" ]; then cat /tmp/pages-resp.json; fi
          # 204 = przełączono; inne kody logujemy, ale nie przerywamy deployu.

      - name: Instalacja zależności
        run: npm ci

      # Zdjęcia i biografie zmieniają się rzadko — cache'ujemy je, by kolejne
      # deploye nie pobierały od nowa ~500 zdjęć (skrypt sync pomija istniejące pliki).
      - name: Cache zdjęć i biografii
        uses: actions/cache@v4
        with:
          path: |
            public/photos
            public/photos-mini
            data/wiki
          key: sejm-assets-term10-${{ github.run_id }}
          restore-keys: |
            sejm-assets-term10-

      - name: Synchronizacja danych z API Sejmu (+ zdjęcia, Wikipedia)
        run: npm run sync
        env:
          SEJM_TERM: '10'

      # Rejestr miejscowości (CSV z dane.gov.pl) zmienia się ~raz w roku —
      # cache pozwala budować stronę nawet przy chwilowej awarii źródła.
      - name: Cache rejestru miejscowości (CSV)
        uses: actions/cache@v4
        with:
          path: data/places-cache
          key: places-csv-v1-${{ github.run_id }}
          restore-keys: |
            places-csv-v1-

      - name: Indeks miejscowości (Kto mnie reprezentuje?)
        run: npm run sync:places

      # Zakończone posiedzenia są niezmienne — cache sprawia, że kolejne deploye
      # pobierają tylko 2 najnowsze posiedzenia zamiast całej kadencji.
      - name: Cache głosowań (surowe dane per posiedzenie)
        uses: actions/cache@v4
        with:
          path: data/votings-cache
          key: votings-v4-${{ github.run_id }}
          restore-keys: |
            votings-v4-

      - name: Głosowania (frekwencja + widok „Jak głosowali?")
        run: npm run sync:votings
        env:
          SEJM_TERM: '10'

      # Informacyjnie: czy API Sejmu wysyła nagłówki CORS (dowód pod ewentualne
      # przyszłe pobieranie na żywo z przeglądarki zamiast plików statycznych).
      - name: Sonda CORS API Sejmu (informacyjna)
        run: |
          curl -sSI -H "Origin: https://nintindoadam.github.io" \
            "https://api.sejm.gov.pl/sejm/term10/votings/1/1" | grep -i "access-control-" \
            || echo "BRAK nagłówków CORS"

      - name: Build (statyczny eksport)
        run: npm run build
        env:
          # Na GitHub Pages strona projektu jest serwowana spod „/<nazwa-repo>/".
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload artefaktu
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      # Diagnostyka większości/progów na SAMYM KOŃCU logu — za listą plików
      # artefaktu — żeby była w dostępnym (ograniczonym) ogonie logu Akcji.
      - name: Diagnostyka wyników głosowań (weryfikacja progów)
        if: always()
        run: |
          echo "===== DIAGNOSTYKA WIĘKSZOŚCI (sync:votings) ====="
          cat data/votings-diag.txt || echo "brak pliku diagnostyki"
          echo "===== KONIEC DIAGNOSTYKI ====="

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
