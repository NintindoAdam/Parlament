name: Deploy do GitHub Pages

# Przy każdym pushu: pobierz świeże dane z API Sejmu, zbuduj statyczną stronę i
# opublikuj ją na GitHub Pages. Krok „Synchronizacja" jest jednocześnie testem
# dostępności API — jeśli zakończy się błędem, zobaczysz to w logach Akcji.

on:
  push:
    branches:
      - main
      - claude/parliament-seating-map-taz3k0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pozwól na jeden równoległy deploy; nie przerywaj trwającego.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Konfiguracja GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Włącza/przełącza Pages na tryb „GitHub Actions" automatycznie przez API
          # (wymaga uprawnienia pages: write). Dzięki temu nie trzeba ręcznie zmieniać
          # źródła w ustawieniach repozytorium — to naprawia problem z README na stronie.
          enablement: true
          # UWAGA: świadomie NIE używamy `static_site_generator: next`, bo ta opcja
          # przepisuje next.config i psuje plik .mjs. basePath ustawiamy ręcznie poniżej.

      - name: Instalacja zależności
        run: npm ci

      - name: Synchronizacja danych z API Sejmu (+ zdjęcia, Wikipedia)
        run: npm run sync
        env:
          SEJM_TERM: '10'

      - name: Build (statyczny eksport)
        run: npm run build
        env:
          # Na GitHub Pages strona projektu jest serwowana spod „/<nazwa-repo>/".
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload artefaktu
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
